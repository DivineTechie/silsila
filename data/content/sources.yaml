# Patient-facing clinical text sources.
#
# Rule: Silsila shows people no clinical explanation written by its developers
# or generated by AI. Clinical explanations are paragraphs imported verbatim
# from the sources below, stored with their URL, retrieval date and a SHA-256
# hash, and cited on screen.
#
# Licence (verified 2026-11-06 at https://medlineplus.gov/copyright.html):
