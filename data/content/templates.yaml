# Approved message templates.
#
# These are the only sentences Silsila can show people apart from verbatim
# MedlinePlus text. They are procedural (what happens next, what a number is,
# who can help) and never clinical or reproductive advice. Numbers inside them
# ({...}) are filled only from engine outputs. Nothing is generated by AI at
# runtime: an outbound message must hash-match a rendering of one of these
# templates, or the output gate blocks it.
#
# English text written by the Silsila team. Arabic text is a machine
# translation (Claude, Anthropic) produced at build time and has NOT yet been
# reviewed by a native-speaking clinician; see docs/limitations.md.

meta:
  ar_status: machine-translated, pending native clinical review
  principle: >-
    Non-directive: the system describes facts, calculations and services. It
    never recommends whether to marry, have children, test a pregnancy, or
    end a pregnancy.

templates:
  # ---------------------------------------------------------- invitations --
  invite.anonymous:
    kind: invitation
    en: >-
      A member of your family has had a genetic test result that may also be
      relevant to you. Carrier testing is available if you want it. Opening
      this message does not share anything about you with anyone. You can read
      more, ask a genetic counsellor a question, or do nothing.
    ar: >-
      حصل أحد أفراد عائلتك على نتيجة فحص جيني قد تكون ذات صلة بك أيضاً. فحص
      الحاملين متاح لك إذا رغبت فيه. فتح هذه الرسالة لا يشارك أي معلومات عنك مع أي
      شخص. يمكنك قراءة المزيد، أو طرح سؤال على مستشار وراثي، أو عدم اتخاذ أي إجراء.
  invite.with_condition:
    kind: invitation
    en: >-
      A member of your family has had a genetic test result for {condition}
      that may also be relevant to you. Carrier testing is available if you want
      it. Opening this message does not share anything about you with anyone.
      You can read more, ask a genetic counsellor a question, or do nothing.
    ar: >-
      حصل أحد أفراد عائلتك على نتيجة فحص جيني تتعلق بـ{condition} قد تكون ذات صلة
      بك أيضاً. فحص الحاملين متاح لك إذا رغبت فيه. فتح هذه الرسالة لا يشارك أي
      معلومات عنك مع أي شخص. يمكنك قراءة المزيد، أو طرح سؤال على مستشار وراثي، أو
      عدم اتخاذ أي إجراء.
  invite.with_sender:
    kind: invitation
    en: >-
      {sender} has chosen to let you know about a genetic test result in your
      family that may also be relevant to you. Carrier testing is available if
      you want it. Opening this message does not share anything about you with
      anyone. You can read more, ask a genetic counsellor a question, or do
      nothing.
    ar: >-
      اختار {sender} أن يُعلمك بنتيجة فحص جيني في عائلتك قد تكون ذات صلة بك أيضاً.
      فحص الحاملين متاح لك إذا رغبت فيه. فتح هذه الرسالة لا يشارك أي معلومات عنك
      مع أي شخص. يمكنك قراءة المزيد، أو طرح سؤال على مستشار وراثي، أو عدم اتخاذ أي
      إجراء.
  invite.anonymity_notice:
    kind: interface
    en: >-
      This invitation does not name the person who sent it. In a small family,
      someone may still guess who it was from.
    ar: >-
      هذه الدعوة لا تذكر اسم الشخص الذي أرسلها. في العائلات الصغيرة، قد يتمكن
      البعض من تخمين المرسل.

  # -------------------------------------------------------------- numbers --
  result.carrier_probability:
    kind: numeric
    en: >-
      Based on the family tree, the calculated chance that {person} carries a
      variant in the {gene} gene is {chance}. This is a calculation, not a test
      result. Only a test can show whether {person} is a carrier.
    ar: >-
      بناءً على شجرة العائلة، فإن الاحتمال المحسوب أن يحمل {person} متغيراً في جين
      {gene} هو {chance}. هذا حساب وليس نتيجة فحص. الفحص وحده يمكن أن يبيّن ما إذا
      كان {person} حاملاً.
  result.couple_child_risk:
    kind: numeric
    en: >-
      For a pregnancy of {a} and {b}, the calculated chance that the child would
      have {condition} is {chance}. For two unrelated people in the UAE with no
      known family history, the same calculation gives {baseline}.
    ar: >-
      بالنسبة لحمل {a} و{b}، فإن الاحتمال المحسوب أن يكون الطفل مصاباً بـ{condition}
      هو {chance}. بالنسبة لشخصين غير قريبين في الإمارات دون تاريخ عائلي معروف،
      يعطي الحساب نفسه {baseline}.
  result.residual_not_modelled:
    kind: numeric
    en: >-
      No detection rate has been published for this test, so the chance that
      remains after a negative result cannot be calculated. A genetic counsellor
      can explain what a negative result means.
    ar: >-
      لم يُنشر معدل كشف لهذا الفحص، لذلك لا يمكن حساب الاحتمال المتبقي بعد نتيجة
      سلبية. يمكن للمستشار الوراثي أن يشرح ما تعنيه النتيجة السلبية.
  result.inconsistent:
    kind: safety
    en: >-
      Some results recorded in this family tree do not fit together. This can
      happen for several reasons, including a recording error. No calculation is
      shown until a genetic counsellor has reviewed the family tree.
    ar: >-
      بعض النتائج المسجلة في شجرة العائلة هذه لا تتوافق مع بعضها. قد يحدث هذا
      لأسباب عدة، منها خطأ في التسجيل. لن يُعرض أي حساب حتى يراجع مستشار وراثي شجرة
      العائلة.
  result.too_complex:
    kind: safety
    en: >-
      This family tree is too large or interlinked for an exact calculation in
      this version. No chance is shown. A genetic counsellor will review the
      family tree.
    ar: >-
      شجرة العائلة هذه كبيرة أو متشابكة بدرجة لا تسمح بحساب دقيق في هذا الإصدار.
      لن يُعرض أي احتمال. سيراجع مستشار وراثي شجرة العائلة.
  result.excluded_locus:
    kind: safety
    en: >-
      Silsila does not calculate chances for {condition} in this version because
      the population data needed for the UAE have not been published. A genetic
      counsellor can help instead.
    ar: >-
      لا يحسب سلسلة الاحتمالات لـ{condition} في هذا الإصدار لأن البيانات السكانية
      اللازمة للإمارات لم تُنشر. يمكن للمستشار الوراثي المساعدة بدلاً من ذلك.

  # -------------------------------------------------------------- consent --
  consent.compute:
    kind: consent
    en: >-
      Silsila will use the family tree you enter to calculate chances for your
      relatives. The calculation stays inside this service and is seen by you
      and the genetic counselling team. You can withdraw this permission at any
      time.
    ar: >-
      سيستخدم سلسلة شجرة العائلة التي تدخلها لحساب الاحتمالات لأقاربك. يبقى الحساب
      داخل هذه الخدمة ويطلع عليه أنت وفريق الاستشارة الوراثية. يمكنك سحب هذا الإذن
      في أي وقت.
  consent.invite:
    kind: consent
    en: >-
      You choose who is told and how. Nothing is sent until you confirm and a
      genetic counsellor has checked the message. You can change your mind
      before anything is sent.
    ar: >-
      أنت من يختار من يتم إبلاغه وكيف. لن يُرسل أي شيء حتى تؤكد ويراجع مستشار وراثي
      الرسالة. يمكنك تغيير رأيك قبل إرسال أي شيء.
  consent.decline_recorded:
    kind: consent
    en: >-
      You chose not to inform this relative. Your choice has been recorded and
      nothing will be sent.
    ar: >-
      اخترت عدم إبلاغ هذا القريب. تم تسجيل اختيارك ولن يُرسل أي شيء.

  # ------------------------------------------------------- message replies --
  reply.crisis:
    kind: safety
    en: >-
      If you or someone else is in danger now, call 998 for an ambulance or 999
      for the police. A member of the counselling team has been alerted to your
      message.
    ar: >-
      إذا كنت أنت أو أي شخص آخر في خطر الآن، اتصل بالرقم 998 للإسعاف أو 999
      للشرطة. تم تنبيه أحد أعضاء فريق الاستشارة إلى رسالتك.
    source:
      citation: "UAE Government portal, Handling emergencies: 998 ambulance, 999 police."
      url: https://u.ae/en/information-and-services/justice-safety-and-the-law/handling-emergencies
  safety.footer:
    kind: footer
    en: >-
      If you or someone else is in danger now, call 998 for an ambulance or 999
      for the police. Every message you send here is read by a member of the
      counselling team.
    ar: >-
      إذا كنت أنت أو أي شخص آخر في خطر الآن، اتصل بالرقم 998 للإسعاف أو 999
      للشرطة. كل رسالة ترسلها هنا يقرؤها أحد أعضاء فريق الاستشارة.
    source:
      citation: "UAE Government portal, Handling emergencies: 998 ambulance, 999 police."
      url: https://u.ae/en/information-and-services/justice-safety-and-the-law/handling-emergencies
  reply.decision_request:
    kind: safety
    en: >-
      Decisions about marriage, pregnancy and family are yours to make. Silsila
      cannot tell you what to decide. A genetic counsellor can talk through the
      facts and the options with you. We have asked a counsellor to contact you.
    ar: >-
      القرارات المتعلقة بالزواج والحمل والعائلة قراراتك أنت. لا يستطيع سلسلة أن يخبرك
      بما تقرره. يمكن للمستشار الوراثي مناقشة الحقائق والخيارات معك. لقد طلبنا من
      مستشار التواصل معك.
  reply.religious:
    kind: safety
    en: >-
      Silsila cannot answer religious questions. A genetic counsellor can
      explain the medical facts. We have asked a counsellor to contact you.
    ar: >-
      لا يستطيع سلسلة الإجابة عن الأسئلة الدينية. يمكن للمستشار الوراثي شرح الحقائق
      الطبية. لقد طلبنا من مستشار التواصل معك.
  reply.third_party:
    kind: safety
    en: >-
      Silsila cannot share another person's results or say who in your family is
      involved. Each person decides what to share about themselves.
    ar: >-
      لا يستطيع سلسلة مشاركة نتائج شخص آخر أو تحديد من هو المعني في عائلتك. كل شخص
      يقرر ما يشاركه عن نفسه.
  reply.distress:
    kind: safety
    en: >-
      Thank you for telling us how you feel. We have asked a genetic counsellor
      to contact you.
    ar: >-
      شكراً لإخبارنا بما تشعر به. لقد طلبنا من مستشار وراثي التواصل معك.
  reply.information:
    kind: interface
    en: >-
      Here is information from MedlinePlus (US National Library of Medicine)
      that relates to your question. A genetic counsellor can explain how it
      applies to you.
    ar: >-
      إليك معلومات من MedlinePlus (المكتبة الوطنية للطب الأمريكية) تتعلق بسؤالك.
      يمكن للمستشار الوراثي أن يشرح كيف تنطبق عليك.
  reply.booking:
    kind: interface
    en: >-
      You can book a conversation with a genetic counsellor or carrier testing
      from this page. Your family physician will be told only if you agree.
    ar: >-
      يمكنك حجز موعد للتحدث مع مستشار وراثي أو لإجراء فحص الحاملين من هذه الصفحة.
      لن يتم إبلاغ طبيب الأسرة إلا بموافقتك.
  reply.forwarded:
    kind: interface
    en: >-
      We have passed your message to a genetic counsellor, who will reply.
    ar: >-
      لقد أحلنا رسالتك إلى مستشار وراثي سيرد عليك.

# Comprehension check shown after a relative reads the information. Each
# question's correct answer is stated in the cited MedlinePlus paragraph.
teachback:
  - id: tb.chance_each_pregnancy
    en: "If two parents are both carriers of the same recessive condition, what is the chance with each pregnancy that the child is affected?"
    ar: "إذا كان كلا الوالدين حاملين للحالة المتنحية نفسها، فما احتمال أن يكون الطفل مصاباً في كل حمل؟"
    options:
      - {id: a, en: "25 percent (1 in 4)", ar: "25 بالمئة (1 من 4)", correct: true}
      - {id: b, en: "50 percent (1 in 2)", ar: "50 بالمئة (1 من 2)", correct: false}
      - {id: c, en: "Every child will be affected", ar: "كل الأطفال سيكونون مصابين", correct: false}
    evidence: mp:risk-assessment:0:2
  - id: tb.carriers_usually_well
    en: "Do carriers of a recessive condition usually have signs of the condition?"
    ar: "هل تظهر عادةً على حاملي الحالة المتنحية علامات الحالة؟"
    options:
      - {id: a, en: "Usually not", ar: "عادةً لا", correct: true}
      - {id: b, en: "Yes, always", ar: "نعم، دائماً", correct: false}
    evidence: mp:inheritance-patterns:0:3
  - id: tb.same_each_pregnancy
    en: "Does the chance change if a couple has already had an affected child?"
    ar: "هل يتغير الاحتمال إذا كان لدى الزوجين طفل مصاب من قبل؟"
    options:
      - {id: a, en: "No, it applies equally to each pregnancy", ar: "لا، ينطبق بالتساوي على كل حمل", correct: true}
      - {id: b, en: "Yes, it becomes lower", ar: "نعم، يصبح أقل", correct: false}
    evidence: mp:risk-assessment:0:9
  - id: tb.calculation_not_test
    en: "Is the chance Silsila shows you a test result?"
    ar: "هل الاحتمال الذي يعرضه سلسلة نتيجة فحص؟"
    options:
      - {id: a, en: "No, it is a calculation from the family tree", ar: "لا، إنه حساب من شجرة العائلة", correct: true}
      - {id: b, en: "Yes, it is my result", ar: "نعم، إنه نتيجتي", correct: false}
    evidence: template:result.carrier_probability
