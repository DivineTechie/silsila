    q_en: Which languages does it speak, and can it read aloud?
    q_ar: ما اللغات التي يدعمها، وهل يقرأ بصوت مسموع؟
    keywords_en: [language, languages, arabic, english, urdu, read aloud, listen, voice, audio, literacy, reading level, readability, accessible, accessibility, blind, screen reader]
    keywords_ar: [اللغة, اللغات, العربية, الإنجليزية, الأردية, استمع, صوت, القراءة, مستوى القراءة, إمكانية الوصول, قارئ الشاشة]
    a_en: "Arabic and English throughout, right to left in Arabic. A relative can press Listen on any fixed text: a synthetic voice (labelled as such) reads exactly the approved or quoted text. The Arabic wording and voice are machine translation and have not yet been reviewed by a native-speaking clinician. The figures below are read from the clip manifest and the readability record."
    a_ar: "العربية والإنجليزية في كل الشاشات، ومن اليمين إلى اليسار بالعربية. يستطيع القريب الضغط على «استمع» في أي نص ثابت: صوت اصطناعي (موسوم بذلك) يقرأ النص المعتمد أو المقتبس كما هو. الصياغة العربية وصوتها ترجمة آلية لم يراجعها بعد طبيب من متحدثي العربية. الأرقام أدناه مقروءة من سجل المقاطع وسجل مقروئية النص."
    tool: access_evidence
    sources: [{label: Read-aloud clips, path: data/content/audio/manifest.json}, {label: Readability, path: docs/evidence/readability.json}, {label: Accessibility record, path: docs/evidence/accessibility.md}]

  - id: hard_questions
    q_en: What happens when someone sends a distressing or difficult message?
    q_ar: ماذا يحدث حين يرسل أحدهم رسالة مقلقة أو صعبة؟
    keywords_en: [distress, crisis, suicide, difficult question, pregnancy decision, termination, abortion, religious, emergency, triage, message, escalate, safety, harm]
    keywords_ar: [ضيق, أزمة, سؤال صعب, قرار الحمل, إنهاء الحمل, إجهاض, ديني, طوارئ, فرز, رسالة, تصعيد, السلامة, ضرر]
    a_en: "Every message is read by a person. Silsila never answers a question about a marriage, a pregnancy or a religious ruling: it replies with approved wording and alerts a counsellor. Every reply carries the 998 and 999 emergency numbers. A classifier only orders the counsellor's queue; its measured alert sensitivity on a blind synthetic test set is below."
    a_ar: "يقرأ إنسان كل رسالة. لا تجيب سلسلة أبداً عن سؤال يخص زواجاً أو حملاً أو حكماً دينياً: ترد بصياغة معتمدة وتنبّه مستشاراً. ويحمل كل رد رقمي الطوارئ 998 و999. والمصنّف يرتّب قائمة عمل المستشار فقط؛ وحساسية التنبيه المقيسة له على مجموعة اختبار اصطناعية معمّاة أدناه."
    tool: triage_evidence
    sources: [{label: Triage evaluation, path: docs/evidence/triage_rules_ngram.json}, {label: Hazard log, path: docs/governance/hazard-log.md}]

  - id: fhir
    q_en: How does a result get into Silsila, and how does it connect to Malaffi?
    q_ar: كيف تدخل النتيجة إلى سلسلة، وكيف ترتبط بـ«ملفي»؟
    keywords_en: [fhir, malaffi, import, export, integration, interoperability, hl7, record, feed, health information exchange, tamm, emr, connect, standard]
    keywords_ar: [ملفي, استيراد, تصدير, تكامل, ترابط, سجل, منصة تبادل المعلومات الصحية, تم, ربط, معيار]
    a_en: "As a FHIR R4B record, read at counsellor intake. The record is checked first and refused with the reason if it is preliminary, about another person, a variant of uncertain significance or in a gene Silsila does not calculate. Names and identifiers in it are not stored. The reading below was done just now on the fictional sample record. The sample follows no Malaffi specification; a pilot would map to the exchange's real profile."
    a_ar: "على هيئة سجل FHIR R4B يُقرأ عند استقبال المستشار. يُفحص السجل أولاً ويُرفض مع ذكر السبب إن كان أولياً، أو يخص شخصاً آخر، أو متغيّراً غير مؤكد الأهمية، أو في جين لا تحسبه سلسلة. ولا تُخزَّن الأسماء والمعرّفات الواردة فيه. أُجريت القراءة أدناه للتو على السجل النموذجي الخيالي. والنموذج لا يتبع أي مواصفة لـ«ملفي»؛ وفي تجربة ميدانية يُطابَق مع المواصفة الفعلية للمنصة."
    tool: fhir_sample
    sources: [{label: FHIR import, path: backend/src/silsila/api/fhir_import.py}, {label: Sample record, path: data/demo/fhir/newborn_cah_index_result.json}]

  - id: programmes
    q_en: How does it fit the genomics programmes announced in the UAE?
    q_ar: كيف يتوافق مع برامج الجينوم المعلنة في الإمارات؟
    keywords_en: [uae programme, announced, masterplan, genomics masterplan, emirati genome, newborn screening, premarital, premarital screening, doh, department of health, abu dhabi, national, alignment, policy]
    keywords_ar: [برامج الإمارات, معلنة, الخطة الرئيسية, الجينوم الإماراتي, فحص حديثي الولادة, فحص ما قبل الزواج, دائرة الصحة, أبوظبي, وطني, توافق]
    a_en: "Those programmes produce the results that start a cascade; Silsila is the step after the result, for relatives the programmes do not reach. The reported figures below are read from the context file, each with its source. No announcement of family cascade testing was found, and Silsila does not claim the Department of Health has asked for it."
    a_ar: "تُنتج تلك البرامج النتائج التي تبدأ التتبع؛ وسلسلة هي الخطوة التي تلي النتيجة، للأقارب الذين لا تصل إليهم البرامج. الأرقام المنشورة أدناه مقروءة من ملف السياق، كل منها مع مصدره. لم يُعثر على أي إعلان عن فحص تتبعي للعائلات، ولا تدّعي سلسلة أن دائرة الصحة طلبته."
    tool: uae_context
    sources: [{label: Announced programmes, path: docs/evidence/uae_context.json}]

  - id: measures
    q_en: What counts as success?
    q_ar: ما الذي يُعدّ نجاحاً؟
    keywords_en: [success, measure, measures, outcomes, kpi, comprehension, uptake, time to counselling, equity, evaluation, metrics, what is measured, marriages]
    keywords_ar: [نجاح, مقياس, مقاييس, نتائج, الفهم, الإقبال, الوقت حتى الاستشارة, الإنصاف, تقييم, ما الذي يقاس, الزيجات]
    a_en: "The measures the challenge statement names: comprehension, counselling uptake, time to counselling, privacy and equity across languages. They are computed from what the system records; the counts below are this server's demo activity right now. Marriages, cancelled engagements and reproductive choices are never measured as success."
    a_ar: "المقاييس التي يسمّيها نص التحدي: الفهم، والإقبال على الاستشارة، والوقت حتى الاستشارة، والخصوصية، والإنصاف بين اللغات. تُحسب مما يسجّله النظام؛ والأعداد أدناه هي نشاط العرض على هذا الخادم الآن. ولا يُقاس الزواج ولا فسخ الخطوبة ولا الخيارات الإنجابية كنجاح أبداً."
    tool: outcomes
    sources: [{label: Pilot protocol, path: docs/pilot-protocol.md}]

  - id: options
    q_en: Does Silsila tell couples what to do about a pregnancy or a marriage?
    q_ar: هل تخبر سلسلة الأزواج بما يفعلونه بشأن حمل أو زواج؟
    keywords_en: [advice, advise, recommend, directive, non-directive, options, reproductive options, prenatal, ivf, pgd, embryo, marry, marriage, tell couples, what to do, values]
    keywords_ar: [نصيحة, توصي, توجيه, غير توجيهي, خيارات, خيارات إنجابية, قبل الولادة, أطفال الأنابيب, أجنة, زواج, ماذا يفعلون, القيم]
    a_en: "No. Silsila describes and never directs. A relative can open the question about options before or during a pregnancy and read MedlinePlus text on carrier, prenatal and preimplantation testing, quoted word for word. Questions about what to decide go to a genetic counsellor. There is no compatibility matching and no registry."
    a_ar: "لا. سلسلة تصف ولا توجّه أبداً. يستطيع القريب فتح سؤال الخيارات قبل الحمل أو أثناءه وقراءة نص MedlinePlus عن فحص الحاملين والفحص قبل الولادة والفحص قبل الانغراس، منقولاً حرفياً. وأسئلة «ماذا نقرر» تذهب إلى مستشار وراثي. لا مطابقة توافق ولا سجل."
    sources: [{label: Approved templates, path: data/content/templates.yaml}, {label: Common questions, path: data/content/faq.yaml}]

  - id: why_cousins
    q_en: Why does cousin marriage matter here?
    q_ar: لماذا يهم زواج الأقارب هنا؟
    keywords_en: [cousin marriage, consanguinity, consanguineous, related parents, why cousins, recessive, why relatives, already married, extended family]
    keywords_ar: [زواج الأقارب, القرابة, أبناء العمومة, والدان قريبان, متنحية, لماذا الأقارب, متزوجون بالفعل, العائلة الممتدة]
    a_en: "A recessive condition appears when a child inherits the same variant from both parents. Relatives of an affected child are much more likely to carry it, and where cousins marry, two carriers are more likely to be a couple. In the only national survey, 50.5% of UAE-national marriages were between relatives (al-Gazali 1997, PMID 9881148). Testing the extended families of affected children found 31% of relatives were carriers and 8% of married couples were both carriers (Ahmed 2002, PMID 12374877). Premarital screening reaches couples before marriage; these couples are already married."
    a_ar: "تظهر الحالة المتنحية حين يرث الطفل المتغيّر نفسه من كلا الوالدين. أقارب الطفل المصاب أكثر عرضة بكثير لحمله، وحيث يتزوج أبناء العمومة يزداد احتمال أن يكون الحاملان زوجين. في المسح الوطني الوحيد، كانت 50.5% من زيجات مواطني الإمارات بين أقارب (الغزالي 1997، PMID 9881148). وفحص العائلات الممتدة لأطفال مصابين وجد أن 31% من الأقارب حاملون وأن 8% من الأزواج كلاهما حامل (أحمد 2002، PMID 12374877). فحص ما قبل الزواج يصل إلى الأزواج قبل الزواج؛ أما هؤلاء فمتزوجون بالفعل."
    sources: [{label: "al-Gazali 1997", url: "https://pubmed.ncbi.nlm.nih.gov/9881148/"}, {label: "Ahmed et al., NEJM 2002", url: "https://pubmed.ncbi.nlm.nih.gov/12374877/"}]

  - id: limits
    q_en: What are its limits? What has not been shown yet?
    q_ar: ما حدوده؟ وما الذي لم يُثبَت بعد؟
    keywords_en: [limits, limitations, limitation, not shown, not proven, weakness, risks, what is missing, caveats, honest, patients, real patients, clinical use, medical device, validated, approved, regulator]
    keywords_ar: [حدود, قيود, لم يثبت, نقاط ضعف, مخاطر, ما الناقص, تحفظات, مرضى, استخدام سريري, جهاز طبي, معتمد, الجهة التنظيمية]
    a_en: "It is a prototype tested only on synthetic families and messages; it has not been used with patients and is not a medical device. It calculates three genes. Cascade yields are projections from simulation. The Arabic is machine translation awaiting a native-speaking clinician, no genetic counsellor has reviewed the templates, and no read-aloud clip has been checked by a native listener. Storage is a demo database. No programme has asked for cascade testing."
    a_ar: "هو نموذج أولي اختُبر على عائلات ورسائل اصطناعية فقط؛ لم يُستخدم مع مرضى وليس جهازاً طبياً. يحسب ثلاثة جينات. ومردود التتبع إسقاطات من المحاكاة. والعربية ترجمة آلية بانتظار طبيب من متحدثيها، ولم يراجع مستشار وراثي القوالب، ولم يتحقق مستمع من أهل اللغة من أي مقطع صوتي. والتخزين قاعدة بيانات تجريبية. ولم يطلب أي برنامج الفحص التتبعي."
    sources: [{label: Limitations, path: docs/limitations.md}, {label: Hazard log, path: docs/governance/hazard-log.md}]

  - id: pilot
    q_en: How would a pilot work, and who would pay?
    q_ar: كيف تجري تجربة ميدانية، ومن يدفع؟
    keywords_en: [pilot, cost, price, pricing, pay, buyer, business, commercial, revenue, customer, path to pilot, who buys, counsellors, workforce, shadow mode]
    keywords_ar: [تجربة ميدانية, تكلفة, سعر, تسعير, يدفع, المشتري, تجاري, إيراد, عميل, من يشتري, المستشارون, القوى العاملة]
    a_en: "The buyer is the programme that already finds index cases; the operator is the genetics service it refers to. The proposal is a shadow phase first, with counsellors running their usual process while Silsila computes alongside and nothing is sent, then an assisted phase with counsellor approval of every message. Pricing proposed per index family started, to be tested in the pilot; nothing is validated yet. The UAE has 9 practising genetic counsellors (Almarri 2025), so counsellor time is the scarce resource."
    a_ar: "المشتري هو البرنامج الذي يجد الحالات الدليل بالفعل؛ والمشغّل هو خدمة الوراثة التي يُحيل إليها. المقترح مرحلة ظلّ أولاً، يواصل فيها المستشارون إجراءهم المعتاد بينما تحسب سلسلة بالتوازي ولا يُرسل شيء، ثم مرحلة مساعدة مع اعتماد المستشار لكل رسالة. التسعير المقترح لكل عائلة دليل تبدأ التتبع، ويُختبر في التجربة؛ ولا شيء مُتحقَّق منه بعد. في الإمارات 9 مستشارين وراثيين ممارسين (المرّي 2025)، فوقت المستشار هو المورد النادر."
    sources: [{label: Commercial case, path: docs/commercial-case.md}, {label: Pilot protocol, path: docs/pilot-protocol.md}, {label: "Almarri et al. 2025", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12619030/"}]

  - id: voice
    q_en: How does voice intake work?
    q_ar: كيف يعمل الإدخال الصوتي؟
    keywords_en: [voice intake, speech, spoken, story, emirati, dialect, jais asr, asr, family tree from speech, transcribe, draft tree, recorded]
    keywords_ar: [الإدخال الصوتي, كلام, منطوقة, قصة, إماراتية, لهجة, التعرف على الكلام, شجرة من الكلام, مسودة الشجرة, مسجل]
    a_en: "A family tells its story in Emirati Arabic. Jais-ASR transcribes it and Jais 3 drafts a family tree: people, sex, parents and marriages only. The checks list every problem, the counsellor confirms every person and every marriage, and only then does the exact engine calculate. Health status heard in speech is never used. The hosted site replays one recorded run with a synthetic voice, labelled as recorded."
    a_ar: "تروي العائلة قصتها باللهجة الإماراتية. يحوّلها Jais-ASR إلى نص ويصوغ Jais 3 مسودة شجرة العائلة: الأشخاص والجنس والوالدان والزيجات فقط. تسرد الفحوص كل مشكلة، ويؤكد المستشار كل شخص وكل زواج، وبعدها فقط يحسب المحرك الدقيق. والحالة الصحية المسموعة في الكلام لا تُستخدم أبداً. والموقع المستضاف يعيد تشغيل تسجيل واحد بصوت اصطناعي موسوم بأنه مسجَّل."
    sources: [{label: Voice-intake model card, path: docs/governance/model-card-voice-intake.md}]
