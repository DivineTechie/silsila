[project]
name = "translation-qc"
version = "0.1.0"
description = "Multi-system check of Arabic translations of patient-facing text"
readme = "README.md"
authors = [
    { name = "Tushar Agarwal", email = "tusharaggarwal630@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sacremoses>=0.2.0",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
translation-qc = "translation_qc:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
